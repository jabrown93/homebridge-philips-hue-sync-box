services:
  mockServer:
    image: mockserver/mockserver:9.0.0@sha256:3b9e91077598e2278af1edd5c417813b344212bd267631bb77298193a49981f5
    ports:
      - 1080:1080
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/initializerJson.json
    volumes:
      - type: bind
        source: ./mockserver-config
        target: /config
