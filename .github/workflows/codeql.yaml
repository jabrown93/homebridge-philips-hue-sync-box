---
name: 'CodeQL Advanced'
on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: '25 22 * * 5'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    # codeql is now a composite action, so the caller owns runs-on and MUST
    # grant the permissions CodeQL needs. Language defaults to
    # javascript-typescript / build-mode none, which is correct for this repo.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: jabrown93/ci/actions/codeql@ae8087545df7e009d15886d87ad1c8a932d8b583 # codeql-v1.0.6
