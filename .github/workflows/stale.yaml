---
name: 'Close stale issues and PRs'
on:
  schedule:
    - cron: '30 1 * * *'
jobs:
  stale:
    # stale is now a composite action, so the caller owns runs-on and MUST grant
    # the permissions actions/stale needs. The schedule trigger stays here.
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - uses: jabrown93/ci/actions/stale@ac1c2c4ff034c904f3c313c28ac5946406116659 # stale-v1.0.1
